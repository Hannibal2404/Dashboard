<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#15120F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="liste.webmanifest">
<title>Einkaufsliste</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#15120F;--card:#1E1A16;--ink:#F2EDE5;--muted:#A79E90;--faint:#6E665B;--line:#2C2823;--chip:#26221D;
  --good:#0ca30c;--warn:#fab219;--warn-ink:#f7c96b;--bad-ink:#eb8f8f;
  --serif:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto;
  -webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
h1{font-family:var(--serif);font-size:32px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-family:var(--sans);font-size:14px;font-weight:400;color:var(--muted)}
.add{display:flex;gap:8px;margin:16px 0 14px;position:sticky;top:0;background:var(--paper);padding:6px 0;z-index:2}
.add input{flex:1;min-width:0;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px}
.add button{font-size:24px;padding:4px 18px;background:var(--warn);color:#1b1408;border:0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.chip{font-size:15px;padding:6px 12px;border-radius:999px;background:transparent;border:1px dashed #4a4238;color:var(--muted);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip::before{content:"+ ";color:var(--warn-ink)}
.chip.del{border-style:solid;border-color:rgba(208,59,59,.5);color:var(--ink)}
.chip.del::before{content:"× ";color:var(--bad-ink)}
.chip-edit{font-size:14px;padding:6px 12px;border-radius:999px;color:var(--muted)}
ul{list-style:none;display:flex;flex-direction:column;gap:6px}
li{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:18px}
li .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted)}
li.done{opacity:.45} li.done .t{text-decoration:line-through}
li.done .box{background:var(--good);border-color:var(--good)}
li .t{flex:1;min-width:0;overflow-wrap:anywhere}
li .x{background:none;border:0;color:var(--faint);font-size:22px;padding:0 4px}
.sep{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:18px 0 6px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sep button{font-size:13px;letter-spacing:0;text-transform:none;padding:5px 10px;font-weight:400}
.muted{color:var(--muted)} .err{color:var(--bad-ink)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.setup{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
.setup ol{margin:10px 0 14px 20px;line-height:1.55;color:var(--muted)}
.setup a{color:var(--warn-ink)}
.setup input{width:100%;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:12px;margin:4px 0 10px;font-size:16px}
.setup .primary{background:var(--warn);color:#1b1408;border:0;font-weight:700;width:100%;padding:12px}
footer{margin-top:28px;text-align:center;font-size:13px;color:var(--faint)}
footer button{font-size:13px;background:none;border:0;color:var(--faint);text-decoration:underline}
</style>
</head>
<body>
<h1>Einkaufsliste <small id="state"></small></h1>
<div id="app"></div>
<footer id="foot"></footer>

<script src="lib.js?v=6"></script>
<script>
const $ = id => document.getElementById(id);
let data = Liste.cached(), busy = 0;

function render(err) {
  const app = $("app");
  if (!Liste.token()) {
    $("state").textContent = ""; $("foot").innerHTML = "";
    app.innerHTML = `<div class="setup">
      <p class="muted">Einmalig verbinden, dann sehen Handy und Küchen-iPad dieselbe Liste.</p>
      <ol><li><a href="${TOKEN_URL}" target="_blank" rel="noopener">Schlüssel bei GitHub anlegen</a> (Häkchen „gist“ ist schon gesetzt)</li>
      <li>Ablauf wählen, „Generate token“ tippen</li><li>Schlüssel (<code>ghp_…</code>) kopieren und hier einfügen</li></ol>
      <input type="password" id="tok" placeholder="ghp_…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="err" id="serr"></p>
      <button class="primary" id="save">Verbinden</button></div>`;
    $("save").onclick = async () => {
      const t = $("tok").value.trim(); if (!t) { $("serr").textContent = "Bitte den Schlüssel einfügen."; return; }
      $("serr").textContent = "Verbinde …";
      try { data = await Liste.setup(t); render(); } catch (e) { $("serr").textContent = e.message; }
    };
    return;
  }
  $("state").innerHTML = err ? `<span class="err">${esc(err)}</span>` : "";
  const open = data.items.filter(i => !i.done), done = data.items.filter(i => i.done);
  const focused = document.activeElement && document.activeElement.id === "nv";
  const val = focused ? $("nv").value : "";
  const li = i => `<li data-id="${i.id}" class="${i.done ? "done" : ""}"><span class="box"></span><span class="t">${esc(i.text)}</span><button class="x" aria-label="Löschen">×</button></li>`;
  app.innerHTML = `
    <form class="add" id="f"><input id="nv" placeholder="Was fehlt?" enterkeyhint="done" autocomplete="off"><button aria-label="Hinzufügen">＋</button></form>
    <div class="chips">${chipsHtml(data, 8)}</div>
    ${open.length ? `<ul>${open.map(li).join("")}</ul>` : `<div class="empty">Alles da 🎉</div>`}
    ${done.length ? `<div class="sep"><span>Im Wagen (${done.length})</span><button id="clr">Entfernen</button></div><ul>${done.map(li).join("")}</ul>` : ""}`;
  $("foot").innerHTML = `<div id="siriBox"></div><button id="siri">Siri einrichten</button> · <button id="out">Verbindung auf diesem Gerät trennen</button>`;
  $("siri").onclick = async () => {
    let url; try { url = await Liste.inboxUrl(); } catch (e) { $("siriBox").innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
    $("siriBox").innerHTML = `<div class="setup" style="text-align:left;margin-bottom:12px">
      <p class="muted">Diese Adresse brauchst du im Kurzbefehl (Schritt „Inhalte von URL abrufen“):</p>
      <input id="siriUrl" readonly value="${esc(url)}" style="font-size:13px">
      <button class="primary" id="copyUrl">Adresse kopieren</button></div>`;
    $("copyUrl").onclick = async () => {
      try { await navigator.clipboard.writeText(url); $("copyUrl").textContent = "Kopiert ✓"; }
      catch { $("siriUrl").select(); $("copyUrl").textContent = "Markiert – jetzt „Kopieren“ tippen"; }
    };
  };
  $("out").onclick = () => { if (confirm("Schlüssel von diesem Gerät löschen? Die Liste selbst bleibt erhalten.")) { Liste.logout(); data = { items: [] }; render(); } };
  if (focused) { $("nv").value = val; $("nv").focus(); }
  $("f").onsubmit = e => {
    e.preventDefault();
    const t = $("nv").value.trim(); if (!t) return;
    $("nv").value = ""; optimisticAdd(data, t);
    render(); $("nv").focus(); go(Liste.add(t));
  };
  bindChips(app,
    t => { optimisticAdd(data, t); render(); go(Liste.add(t)); },
    t => { data.hidden = [...(data.hidden || []), t.toLowerCase()]; render(); go(Liste.hide(t)); },
    () => render());
  app.querySelectorAll("li").forEach(el => {
    const id = el.dataset.id;
    el.onclick = () => { const it = data.items.find(x => x.id === id); if (!it || id.startsWith("tmp")) return; it.done = !it.done; render(); go(Liste.toggle(id)); };
    el.querySelector(".x").onclick = ev => { ev.stopPropagation(); if (id.startsWith("tmp")) return; data.items = data.items.filter(x => x.id !== id); render(); go(Liste.remove(id)); };
  });
  if ($("clr")) $("clr").onclick = () => { data.items = data.items.filter(x => !x.done); render(); go(Liste.clearDone()); };
}
async function go(p) { busy++; $("state").textContent = "…"; try { data = await p; render(); } catch (e) { render(e.message); } finally { busy--; } }
function refresh() { if (Liste.token() && !busy && !document.hidden) go(Liste.load()); }

render(); refresh();
setInterval(refresh, 30 * 1000);
document.addEventListener("visibilitychange", refresh);
watchForUpdates(30);
</script>
</body>
</html>
